<form nz-form [formGroup]="validateForm" (ngSubmit)="handleOk()" nzLayout="vertical">
  <nz-form-item>
    <nz-form-label [nzRequired]="true">Nombre del País</nz-form-label>
    <nz-form-control nzErrorTip="Ingrese el nombre del país">
      <input nz-input formControlName="name" placeholder="Ej: Colombia, España" />
    </nz-form-control>
  </nz-form-item>

  <div class="row">
    <div class="col-md-6">
      <nz-form-item>
        <nz-form-label [nzRequired]="true">Código ISO (2 carac.)</nz-form-label>
        <nz-form-control nzErrorTip="Ingrese código ISO 2 (ej: CO)">
          <input nz-input formControlName="isoCode2" placeholder="CO" maxlength="2" />
        </nz-form-control>
      </nz-form-item>
    </div>
    <div class="col-md-6">
      <nz-form-item>
        <nz-form-label [nzRequired]="true">Prefijo Telefónico</nz-form-label>
        <nz-form-control nzErrorTip="Ingrese prefijo (ej: 57)">
          <input nz-input formControlName="phonePrefix" placeholder="57" />
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>

  <div class="ant-modal-footer" style="margin: 0 -24px -24px -24px; padding: 10px 16px; border-top: 1px solid #f0f0f0;">
    <button nz-button nzType="default" (click)="handleCancel()" type="button" [disabled]="isSubmitting()">Cancelar</button>
    <button nz-button nzType="primary" [nzLoading]="isSubmitting()" type="submit">Guardar País</button>
  </div>
</form>
