<form nz-form [formGroup]="validateForm" (ngSubmit)="handleOk()" nzLayout="vertical">
  <nz-form-item>
    <nz-form-label [nzRequired]="true">Nombre de la Ciudad</nz-form-label>
    <nz-form-control nzErrorTip="Ingrese el nombre">
      <input nz-input formControlName="name" placeholder="Ej: Medellín, Barcelona" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label [nzRequired]="true">Código DANE / Postal</nz-form-label>
    <nz-form-control nzErrorTip="Ingrese el código">
      <input nz-input formControlName="daneCode" placeholder="Ej: 05001" />
    </nz-form-control>
  </nz-form-item>

  <div class="ant-modal-footer" style="margin: 0 -24px -24px -24px; padding: 10px 16px; border-top: 1px solid #f0f0f0;">
    <button nz-button nzType="default" (click)="handleCancel()" type="button" [disabled]="isSubmitting()">Cancelar</button>
    <button nz-button nzType="primary" [nzLoading]="isSubmitting()" type="submit">Guardar Ciudad</button>
  </div>
</form>
