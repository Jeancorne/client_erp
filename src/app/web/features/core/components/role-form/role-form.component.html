<form nz-form [formGroup]="validateForm" (ngSubmit)="handleOk()" nzLayout="vertical" class="erp-form-container">
  <div class="erp-form-body">
    <div class="erp-form-panel mt-3">
      <nz-form-item>
        <nz-form-label>Empresa</nz-form-label>
        <nz-form-control>
          <input nz-input [value]="companyName()" disabled />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label [nzRequired]="true">Nombre del Rol</nz-form-label>
        <nz-form-control nzErrorTip="Por favor ingrese el nombre del rol">
          <input nz-input formControlName="name" placeholder="Ej: Administrador, Vendedor" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label>Descripción</nz-form-label>
        <nz-form-control>
          <textarea nz-input formControlName="description" [nzAutosize]="{ minRows: 2, maxRows: 4 }" placeholder="Descripción opcional"></textarea>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>

  <div class="erp-form-footer">
    <button nz-button nzType="default" (click)="handleCancel()" type="button" [disabled]="isSubmitting()" class="me-2">Cancelar</button>
    <button nz-button nzType="primary" [nzLoading]="isSubmitting()" type="submit">Guardar</button>
  </div>
</form>
