<form nz-form [formGroup]="validateForm" (ngSubmit)="handleOk()" nzLayout="vertical">
  <div class="row">
    <div class="col-md-6">
      <nz-form-item>
        <nz-form-label [nzRequired]="true">Nombres</nz-form-label>
        <nz-form-control nzErrorTip="Ingrese el nombre">
          <input nz-input formControlName="firstName" placeholder="Nombres" />
        </nz-form-control>
      </nz-form-item>
    </div>
    <div class="col-md-6">
      <nz-form-item>
        <nz-form-label [nzRequired]="true">Apellidos</nz-form-label>
        <nz-form-control nzErrorTip="Ingrese el apellido">
          <input nz-input formControlName="lastName" placeholder="Apellidos" />
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>

  <nz-form-item>
    <nz-form-label [nzRequired]="true">Email</nz-form-label>
    <nz-form-control nzErrorTip="Ingrese un email válido">
      <input nz-input formControlName="email" type="email" placeholder="correo@ejemplo.com" />
    </nz-form-control>
  </nz-form-item>

  <div class="row">
    <div class="col-md-6">
      <nz-form-item>
        <nz-form-label>Teléfono</nz-form-label>
        <nz-form-control>
          <input nz-input formControlName="phone" placeholder="Teléfono / Celular" />
        </nz-form-control>
      </nz-form-item>
    </div>
    <div class="col-md-6">
      <nz-form-item>
        <nz-form-label>Cargo</nz-form-label>
        <nz-form-control>
          <input nz-input formControlName="jobTitle" placeholder="Ej: Gerente, Compras" />
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>

  <div class="row">
    <div class="col-md-6">
      <nz-form-item>
        <nz-form-label>Facturación Electrónica?</nz-form-label>
        <nz-form-control>
          <nz-switch formControlName="isBillingContact"></nz-switch>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div class="col-md-6">
      <nz-form-item>
        <nz-form-label>Activo</nz-form-label>
        <nz-form-control>
          <nz-switch formControlName="isActive"></nz-switch>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>

  <div class="ant-modal-footer" style="margin: 0 -24px -24px -24px; padding: 10px 16px; border-top: 1px solid #f0f0f0;">
    <button nz-button nzType="default" (click)="handleCancel()" type="button" [disabled]="isSubmitting()">Cancelar</button>
    <button nz-button nzType="primary" [nzLoading]="isSubmitting()" type="submit">Guardar Contacto</button>
  </div>
</form>
