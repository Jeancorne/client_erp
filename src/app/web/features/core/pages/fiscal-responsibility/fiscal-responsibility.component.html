<div>
  <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>

  <div class="body-content mt-3">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="mb-0">Responsabilidad Fiscal</h4>
      <button nz-button nzType="primary" (click)="openModal()">
        <i nz-icon nzType="plus"></i> Nueva Responsabilidad
      </button>
    </div>

    <div class="bg-white rounded shadow-sm overflow-hidden p-3">
      <nz-table #respTable [nzData]="items()" [nzLoading]="isLoading()" nzSize="middle" [nzBordered]="true">
        <thead>
          <tr>
            <th style="width: 150px">Código</th>
            <th>Nombre</th>
            <th class="text-center" style="width: 150px">Estado</th>
            <th class="text-center" style="width: 150px">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (item of respTable.data; track item.id) {
            <tr>
              <td><nz-tag><b>{{ item.code }}</b></nz-tag></td>
              <td>
                <div><b>{{ item.name }}</b></div>
                <small class="text-muted">{{ item.description }}</small>
              </td>
              <td class="text-center">
                <nz-tag [nzColor]="item.isActive ? 'success' : 'default'">
                  {{ item.isActive ? 'Activa' : 'Inactiva' }}
                </nz-tag>
              </td>
              <td class="text-center">
                <button nz-button nzType="text" nzSize="small" (click)="openModal(item)" nz-tooltip nzTooltipTitle="Ver/Editar">
                  <i nz-icon nzType="edit" class="text-primary"></i>
                </button>
                <nz-divider nzType="vertical"></nz-divider>
                <button nz-button nzType="text" nzSize="small" (click)="deleteItem(item)" nz-tooltip nzTooltipTitle="Eliminar">
                  <i nz-icon nzType="delete" class="text-danger"></i>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </nz-table>
    </div>
  </div>
</div>
